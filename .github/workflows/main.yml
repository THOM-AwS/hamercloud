name: Upload Website

# Deploys the static site on push to main only, never from a pull request or
# another branch. Runs in the hamercloud-site environment (main only), whose
# OIDC role can sync www.hamer.cloud and invalidate its distribution and
# nothing else. Infra changes are deployed by infra.yml.
on:
  push:
    branches: [main]
    paths-ignore:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".github/scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy-s3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hamercloud-site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_SITE_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: hamercloud-site-${{ github.run_id }}

      # Only the website is published. Repo tooling, infra code and build
      # plans stay out of the bucket (--delete never touches excluded keys).
      - name: Sync site
        run: >-
          aws s3 sync . s3://www.hamer.cloud --delete --no-progress
          --exclude '.git/*' --exclude '.github/*' --exclude '.claude/*'
          --exclude 'infra/*' --exclude 'docs/superpowers/*'
          --exclude '.gitignore' --exclude '*.DS_Store'

  invalidate-cf:
    needs: deploy-s3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: hamercloud-site
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_SITE_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: hamercloud-invalidate-${{ github.run_id }}

      - name: Invalidate
        env:
          DISTRIBUTION: ${{ secrets.AWS_CF_DISTRIBUTION_ID }}
        run: |
          id=$(aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION" --paths '/*' --query Invalidation.Id --output text)
          aws cloudfront wait invalidation-completed --distribution-id "$DISTRIBUTION" --id "$id"
          echo "invalidation $id complete"
