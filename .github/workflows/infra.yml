name: infra

# Terraform for infra/ (S3 + CloudFront site, api.hamer.cloud, Fitbit Lambdas).
# Adapted from qwen-spot's terraform.yml.
#
# plan:  every push to any branch, read-only role, no approval. Never writes
#        state (-lock=false) and prints only resource addresses (public repo).
# apply: push to main (or a dispatch from main). Runs in the hamercloud-infra
#        environment (main only, required reviewer), re-plans with the write
#        role and stops unless its summary hash equals the plan job's.
on:
  push:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
      - ".github/scripts/**"
  workflow_dispatch:
    inputs:
      action:
        description: plan or apply
        type: choice
        options: [plan, apply]
        default: plan

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "1"
  # The state lives in the "hamer" workspace, as it did in mytf/websites.
  TF_WORKSPACE: hamer

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      summary_sha: ${{ steps.plan.outputs.summary_sha }}
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: hamercloud-plan-${{ github.run_id }}

      - name: Init
        run: ../.github/scripts/tf-quiet.sh init -input=false -no-color

      - name: Validate
        run: ../.github/scripts/tf-quiet.sh validate -no-color

      # Public repo: logs are world-readable, so the plan file is never
      # uploaded and only resource addresses and actions are printed.
      - name: Plan
        id: plan
        run: |
          ../.github/scripts/tf-quiet.sh plan -input=false -no-color -lock=false -out=tfplan
          terraform show -json tfplan | jq -r '
            .resource_changes[]
            | select(.change.actions != ["no-op"])
            | "\(.change.actions | join(",")) \(.address)"' | sort > plan-summary.txt
          sha=$(sha256sum plan-summary.txt | cut -d' ' -f1)
          echo "summary_sha=$sha" >> "$GITHUB_OUTPUT"
          cat plan-summary.txt
          {
            echo "### Plan ($(wc -l < plan-summary.txt) changes, summary sha256 \`${sha:0:12}\`)"
            echo '```'
            cat plan-summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove plan
        if: always()
        run: rm -f tfplan

  apply:
    needs: plan
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.action == 'apply')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: hamercloud-infra
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.14.7
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: hamercloud-apply-${{ github.run_id }}

      - name: Init
        run: ../.github/scripts/tf-quiet.sh init -input=false -no-color

      - name: Re-plan and compare with the approved plan
        env:
          APPROVED_SHA: ${{ needs.plan.outputs.summary_sha }}
        run: |
          ../.github/scripts/tf-quiet.sh plan -input=false -no-color -out=tfplan
          terraform show -json tfplan | jq -r '
            .resource_changes[]
            | select(.change.actions != ["no-op"])
            | "\(.change.actions | join(",")) \(.address)"' | sort > plan-summary.txt
          sha=$(sha256sum plan-summary.txt | cut -d' ' -f1)
          if [ "$sha" != "$APPROVED_SHA" ]; then
            echo "::error::plan changed since it was approved; run plan again"
            cat plan-summary.txt
            exit 1
          fi
          if [ ! -s plan-summary.txt ]; then
            echo "no changes, nothing to apply"
            echo "EMPTY=1" >> "$GITHUB_ENV"
          fi

      - name: Apply
        if: env.EMPTY != '1'
        run: ../.github/scripts/tf-quiet.sh apply -input=false -no-color tfplan && echo applied

      - name: Remove plan
        if: always()
        run: rm -f tfplan
